env: rc
project_id: ${GCP_PROJECT_ID}    # export GCP_PROJECT_ID=... (set per environment in CI)
region: us-central1
timezone: UTC
pipeline_root: gs://${GCP_PROJECT_ID}-storm-ml/pipeline_root
staging_bucket: gs://${GCP_PROJECT_ID}-storm-ml/staging
service_account: vertex-pipelines@${GCP_PROJECT_ID}.iam.gserviceaccount.com

bigquery:
  location: US                 # must match the public NOAA dataset (US multi-region)
  dataset: storm_ml
  raw_table: storm_events_raw
  features_table: storm_features_weekly
  leaderboard_table: model_leaderboard
  evaluation_table: model_evaluations   # one promotion decision per training run
  predictions_table: storm_predictions

data:
  start_year: 2000
  end_year: 0                  # 0 = current year (resolved when each run starts)
  refresh_raw_data: true
  val_weeks: 52
  test_weeks: 52

model:
  display_name: storm-weekly-event-forecaster
  # Registry entry is used for versioning + aliases; batch scoring loads the
  # artifact directly. Set a serving image if you also deploy to an endpoint.
  serving_container_image_uri: ""

training:
  # The best of the 4 models replaces the champion only if its test RMSE is lower
  # by at least this many percent (both scored on the same test weeks). 0 = any improvement.
  min_improvement_pct: 0.0
  hyperparameters:
    linear_regression: {}
    ridge: {alpha: 10.0}
    random_forest: {n_estimators: 300, max_depth: 12, min_samples_leaf: 5, max_features: 0.5, n_jobs: -1, random_state: 42}
    xgboost: {n_estimators: 600, learning_rate: 0.05, max_depth: 6, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 5, tree_method: hist, n_jobs: -1, random_state: 42}

schedules:                     # cron, in UTC
  training: "0 4 1 * *"        # monthly retraining: 1st of every month, 04:00
  batch_inference: "0 6 * * 1" # weekly forecast: Mondays 06:00
