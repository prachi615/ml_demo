# CI/CD for the storm forecasting Vertex AI pipelines.
#
# Release flow (nothing runs when a PR is opened; everything starts after a merge or a tag):
#
#   feature branch --PR (approved + merged)--> dev    : CI -> deploy DEV
#   commit on dev  --tag vX.Y.Z-rcN------------> rc     : CI -> deploy RC -> move `rc` branch to the tag
#                                                         -> open/refresh the PR  rc -> main
#   rc             --PR (approved + merged)--> main   : CI -> check main == latest RC -> deploy PROD
#                                                         -> create GitHub release vX.Y.Z
#
# Every deploy publishes the pipelines, starts one training run, and (re)creates two
# schedules: monthly retraining and weekly batch inference.
#
# Prod only ever runs code that was already deployed and tested as an RC: the `plan` job
# fails if the merged tree on main differs from the tree of an RC tag.
#
# Auth uses Workload Identity Federation (no JSON keys). For each GitHub environment
# (dev, rc, prod) set: vars.GCP_PROJECT_ID, secrets.WIF_PROVIDER, secrets.DEPLOYER_SA
# (see infra/setup_gcp.sh and the README section "CI/CD").
name: ci-cd

on:
  push:
    branches: [dev, main]
    tags: ["v*-rc*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to (re)deploy from the selected ref"
        type: choice
        options: [dev, rc, prod]
        default: dev
      run_training:
        description: "Submit a training run after deploying"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deployment half-way

env:
  PYTHON_VERSION: "3.12"
  REGION: us-central1
  AR_DOCKER_REPO: storm-ml
  AR_KFP_REPO: storm-pipelines
  IMAGE_NAME: storm-pipeline

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.plan.outputs.env }}
      version: ${{ steps.plan.outputs.version }}
      rc_tag: ${{ steps.plan.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags for the promotion checks

      - id: plan
        name: Decide target environment and run promotion guards
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          RC_RE='^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'
          REL_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          RC_TAG=""

          # Newest RC tag whose content is identical to HEAD (works for merge, squash or rebase merges).
          find_rc_for_head() {
            local head_tree; head_tree=$(git rev-parse 'HEAD^{tree}')
            for t in $(git tag -l 'v*-rc*' --sort=-creatordate); do
              if [ "$(git rev-parse "${t}^{tree}")" = "$head_tree" ]; then echo "$t"; return 0; fi
            done
            return 1
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            ENV="$INPUT_ENV"; VERSION="$REF_NAME"
            if [ "$ENV" = "rc" ] && ! [[ "$REF_NAME" =~ $RC_RE ]]; then
              echo "::error::Manual RC deploys must be started from an RC tag (vX.Y.Z-rcN)"; exit 1
            fi
            if [ "$ENV" = "prod" ] && ! { [[ "$REF_NAME" =~ $REL_RE ]] || [ "$REF_NAME" = "main" ]; }; then
              echo "::error::Manual prod deploys (incl. rollbacks) must use main or a release tag vX.Y.Z"; exit 1
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ $RC_RE ]]; then
              echo "::error::Tag $REF_NAME is not an RC tag (expected vX.Y.Z-rcN)"; exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              echo "::error::RC tags must point at a commit on the dev branch"; exit 1
            fi
            ENV="rc"; VERSION="$REF_NAME"; RC_TAG="$REF_NAME"
          elif [ "$REF_NAME" = "dev" ]; then
            ENV="dev"; VERSION="dev-${GITHUB_SHA::7}"
          elif [ "$REF_NAME" = "main" ]; then
            if ! RC_TAG=$(find_rc_for_head); then
              echo "::error::main does not match any RC tag. Only merge the rc branch into main;"
              echo "::error::bring other changes in through dev and cut a new RC tag."
              exit 1
            fi
            VERSION="${RC_TAG%-rc*}"
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::Release ${VERSION} already exists; cut a new RC with a higher version"; exit 1
            fi
            ENV="prod"
          else
            echo "::error::Unsupported ref $REF_NAME"; exit 1
          fi

          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "### Plan: deploy \`$VERSION\` to **$ENV** ${RC_TAG:+(from \`$RC_TAG\`)}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Lint, test, compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Unit tests
        run: pytest --cov=storm_prediction --cov-report=term-missing --cov-report=xml

      - name: Compile pipelines
        run: python scripts/compile_pipelines.py --output-dir build

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-pipelines
          path: build/*.yaml

  deploy:
    name: Deploy (${{ needs.plan.outputs.env }})
    needs: [plan, ci]   # CD only runs if CI passed
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      VERSION: ${{ needs.plan.outputs.version }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Derive names
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # template tags may not contain dots: v1.2.0-rc1 -> v1-2-0-rc1
          echo "version_tag=${VERSION//./-}" >> "$GITHUB_OUTPUT"
          echo "image=${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_DOCKER_REPO}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "kfp_host=https://${REGION}-kfp.pkg.dev/${GCP_PROJECT_ID}/${AR_KFP_REPO}" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push component image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${{ steps.vars.outputs.image }}" .
          docker push "${{ steps.vars.outputs.image }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Compile and publish pipeline templates to Artifact Registry
        env:
          PIPELINE_IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          python scripts/compile_pipelines.py \
            --output-dir build \
            --registry-host "${{ steps.vars.outputs.kfp_host }}" \
            --tag "${{ steps.vars.outputs.tag }}" \
            --tag "${{ steps.vars.outputs.version_tag }}" \
            --tag "${DEPLOY_ENV}"

      # One training run right away, so new code gets a champion without waiting
      # for the 1st of the month. Skippable on manual runs.
      - name: Submit training pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.run_training
        run: |
          python scripts/run_pipeline.py \
            --pipeline training \
            --config "configs/${DEPLOY_ENV}.yaml" \
            --template "${{ steps.vars.outputs.kfp_host }}/storm-forecast-training/${{ steps.vars.outputs.tag }}"

      - name: (Re)create monthly training + weekly batch inference schedules
        run: |
          HOST="${{ steps.vars.outputs.kfp_host }}"
          TAG="${{ steps.vars.outputs.tag }}"
          CFG="configs/${DEPLOY_ENV}.yaml"
          TRAIN_CRON=$(python -c "import yaml;print(yaml.safe_load(open('${CFG}'))['schedules']['training'])")
          BATCH_CRON=$(python -c "import yaml;print(yaml.safe_load(open('${CFG}'))['schedules']['batch_inference'])")

          # Monthly retraining (training + evaluation against the champion).
          python scripts/run_pipeline.py --pipeline training --config "$CFG" \
            --template "${HOST}/storm-forecast-training/${TAG}" \
            --schedule "$TRAIN_CRON"

          # Weekly forecast with whichever model is champion at that moment.
          python scripts/run_pipeline.py --pipeline batch_inference --config "$CFG" \
            --template "${HOST}/storm-forecast-batch-inference/${TAG}" \
            --schedule "$BATCH_CRON"

      - name: Summary
        run: |
          {
            echo "### Deployed ${VERSION} to ${DEPLOY_ENV}"
            echo "- Image: \`${{ steps.vars.outputs.image }}\`"
            echo "- Templates: \`${{ steps.vars.outputs.kfp_host }}\` tag \`${{ steps.vars.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-rc:
    name: Move rc branch + open PR to main
    needs: [plan, deploy]
    if: needs.plan.outputs.env == 'rc' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RC_TAG: ${{ needs.plan.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the rc branch at the RC tag
        # rc always mirrors the latest successfully deployed RC tag
        run: git push --force origin "${GITHUB_SHA}:refs/heads/rc"

      - name: Open or update the release PR rc -> main
        run: |
          set -euo pipefail
          VERSION="${RC_TAG%-rc*}"
          BODY=$(printf '%s\n' \
            "Promote **${RC_TAG}** to production as **${VERSION}**." \
            "" \
            "- RC deployed and tested in the \`rc\` environment: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Approving and merging this PR runs CI, then deploys ${VERSION} to prod and creates the release." \
            "- Do not push other commits to this PR; fix issues on dev and cut a new RC tag.")
          PR=$(gh pr list --base main --head rc --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base main --head rc --title "Release ${VERSION} (${RC_TAG})" --body "$BODY"
          else
            gh pr edit "$PR" --title "Release ${VERSION} (${RC_TAG})" --body "$BODY"
          fi

  release:
    name: Create GitHub release
    needs: [plan, deploy]
    if: needs.plan.outputs.env == 'prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      RC_TAG: ${{ needs.plan.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag and publish release
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Promoted from ${RC_TAG}. Deployed to prod by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --generate-notes
